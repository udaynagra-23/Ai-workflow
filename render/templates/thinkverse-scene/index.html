<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ThinkVerse — Scene Calibration</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #f7f7f4; font-family: Arial, Helvetica, sans-serif; }
    #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: radial-gradient(circle at 75% 40%, #ffffff 0, #f7f7f4 58%, #eceeea 100%); color: #111; }
    .eyebrow { position: absolute; left: 150px; top: 132px; font-size: 26px; letter-spacing: 8px; font-weight: 700; color: #777; }
    .headline { position: absolute; left: 145px; top: 300px; width: 1030px; font-size: 94px; line-height: 1.04; font-weight: 800; letter-spacing: -4px; }
    .headline span { color: #777; }
    .subline { position: absolute; left: 153px; top: 570px; width: 880px; font-size: 34px; line-height: 1.35; color: #555; }
    .rule { position: absolute; left: 153px; top: 690px; width: 160px; height: 8px; background: #111; border-radius: 8px; }
    #scene-one, #scene-two { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    .figure-wrap { position: absolute; right: 155px; top: 175px; width: 480px; height: 690px; }
    .figure-shadow { position: absolute; left: 35px; right: 35px; bottom: 0; height: 28px; background: #d9d9d4; border-radius: 50%; filter: blur(8px); }
    .figure { position: absolute; inset: 0; width: 100%; height: 100%; }
    .badge { position: absolute; right: 160px; bottom: 105px; border: 2px solid #d0d0ca; border-radius: 999px; padding: 18px 28px; font-size: 22px; letter-spacing: 3px; color: #555; }
    .chapter { position: absolute; left: 153px; bottom: 100px; font-size: 20px; letter-spacing: 5px; color: #888; }
    .scene-two { position: absolute; inset: 0; background: #111; color: #fff; opacity: 0; }
    .scene-two .question { position: absolute; left: 180px; top: 285px; width: 1560px; font-size: 90px; line-height: 1.12; font-weight: 800; text-align: center; letter-spacing: -3px; }
    .scene-two .answer { position: absolute; left: 300px; top: 560px; width: 1320px; text-align: center; font-size: 34px; color: #c9c9c9; }
    .scene-two .dot { position: absolute; left: 925px; top: 190px; width: 70px; height: 70px; border-radius: 50%; background: #fff; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="thinkverse-calibration" data-start="0" data-duration="12" data-width="1920" data-height="1080">
    <section id="scene-one" class="clip" data-start="0" data-duration="6" data-track-index="1">
      <div class="eyebrow" id="eyebrow">THINKVERSE / EXPLAINER</div>
      <div class="headline" id="headline">Big questions.<br><span>Clear answers.</span></div>
      <div class="subline" id="subline">A visual story should make a difficult idea feel simple — without making it simplistic.</div>
      <div class="rule" id="rule"></div>
      <div class="figure-wrap" id="figure-wrap">
        <div class="figure-shadow"></div>
        <svg class="figure" viewBox="0 0 480 690" role="img" aria-label="Black stick figure wearing a hat and moustache">
          <g fill="none" stroke="#111" stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="238" cy="190" r="88" fill="#f7f7f4"/>
            <path d="M145 128 L330 128 L307 82 L171 82 Z" fill="#111" stroke="#111"/>
            <path d="M150 132 L327 132"/>
            <path d="M204 193 L204 193 M270 193 L270 193" stroke-width="19"/>
            <path d="M238 208 C225 226 213 225 201 216 M238 208 C251 226 263 225 275 216" stroke-width="10"/>
            <path d="M238 278 L238 500"/>
            <path d="M238 330 L145 420 L110 520"/>
            <path d="M238 330 L330 405 L375 500"/>
            <path d="M238 500 L170 625"/>
            <path d="M238 500 L305 625"/>
            <path d="M130 530 L95 530 M395 510 L365 510 M145 635 L190 635 M280 635 L325 635"/>
          </g>
        </svg>
      </div>
      <div class="chapter" id="chapter">STORY FIRST · VISUALS WITH PURPOSE</div>
      <div class="badge" id="badge">16:9 · SCENE TEST</div>
    </section>
    <section id="scene-two" class="clip scene-two" data-start="6" data-duration="6" data-track-index="2">
      <div class="dot" id="dot"></div>
      <div class="question" id="question">The goal isn't more motion.</div>
      <div class="answer" id="answer">It's making every visual earn its place in the story.</div>
    </section>
  </div>
  <script src="./gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    tl.from("#eyebrow", { opacity: 0, y: 24, duration: 0.55, ease: "power3.out" }, 0.15);
    tl.from("#headline", { opacity: 0, y: 55, duration: 0.8, ease: "power3.out" }, 0.45);
    tl.from("#subline", { opacity: 0, y: 30, duration: 0.7, ease: "power2.out" }, 1.05);
    tl.from("#rule", { scaleX: 0, transformOrigin: "left center", duration: 0.55, ease: "power2.out" }, 1.65);
    tl.from("#figure-wrap", { opacity: 0, y: 35, duration: 0.9, ease: "back.out(1.4)" }, 0.7);
    tl.from("#chapter, #badge", { opacity: 0, duration: 0.5, stagger: 0.12 }, 2.0);
    tl.to("#scene-one", { opacity: 0, duration: 0.35 }, 5.55);
    tl.to("#scene-two", { opacity: 1, duration: 0.35 }, 5.65);
    tl.from("#dot", { scale: 0, duration: 0.5, ease: "back.out(1.7)" }, 6.0);
    tl.from("#question", { opacity: 0, y: 45, duration: 0.8, ease: "power3.out" }, 6.35);
    tl.from("#answer", { opacity: 0, y: 25, duration: 0.65, ease: "power2.out" }, 7.15);
    window.__timelines["thinkverse-calibration"] = tl;
  </script>
</body>
</html>
