name: HyperFrames ThinkVerse scene smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hyperframes-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-render:
    name: Render and validate a real 12-second ThinkVerse scene
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      HYPERFRAMES_NO_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      HYPERFRAMES_NO_UPDATE_CHECK: "1"
      HYPERFRAMES_SKIP_SKILLS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FFmpeg and FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg unzip
          ffmpeg -version
          ffprobe -version

      - name: Verify pinned HyperFrames CLI
        run: npx --yes hyperframes@0.9.19 --help

      - name: Create isolated HyperFrames project
        run: |
          mkdir -p "$RUNNER_TEMP/hyperframes-smoke"
          npx --yes hyperframes@0.9.19 init "$RUNNER_TEMP/hyperframes-smoke/project" --example blank --skip-skills
          test -s "$RUNNER_TEMP/hyperframes-smoke/project/index.html"

      - name: Install local animation dependency
        working-directory: ${{ runner.temp }}/hyperframes-smoke/project
        run: |
          npm install --no-save --no-package-lock gsap@3.12.5
          cp node_modules/gsap/dist/gsap.min.js ./gsap.min.js
          test -s ./gsap.min.js

      - name: Inject the committed ThinkVerse composition
        run: |
          cp "$GITHUB_WORKSPACE/render/templates/thinkverse-scene/index.html" "$RUNNER_TEMP/hyperframes-smoke/project/index.html"
          test -s "$RUNNER_TEMP/hyperframes-smoke/project/index.html"
          test -s "$RUNNER_TEMP/hyperframes-smoke/project/gsap.min.js"
          echo "Composition root and timed clips:"
          grep -nE 'data-composition-id|data-start|data-duration|data-track-index|__timelines' "$RUNNER_TEMP/hyperframes-smoke/project/index.html"

      - name: Install pinned local browser
        working-directory: ${{ runner.temp }}/hyperframes-smoke/project
        run: |
          npx --yes hyperframes@0.9.19 browser ensure
          npx --yes hyperframes@0.9.19 browser path

      - name: Lint and run composition checks
        working-directory: ${{ runner.temp }}/hyperframes-smoke/project
        run: |
          npx --yes hyperframes@0.9.19 lint --json | tee "$RUNNER_TEMP/hyperframes-lint.json"
          npx --yes hyperframes@0.9.19 check --json | tee "$RUNNER_TEMP/hyperframes-check.json"

      - name: Render ThinkVerse scene MP4
        working-directory: ${{ runner.temp }}/hyperframes-smoke/project
        run: |
          npx --yes hyperframes@0.9.19 render \
            --fps 30 \
            --quality draft \
            --strict \
            --no-best-effort \
            --output "$RUNNER_TEMP/hyperframes-smoke/thinkverse-scene.mp4"

      - name: Validate MP4 metadata with FFprobe
        run: |
          test -s "$RUNNER_TEMP/hyperframes-smoke/thinkverse-scene.mp4"
          ffprobe -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_type,codec_name,width,height,avg_frame_rate \
            -of json "$RUNNER_TEMP/hyperframes-smoke/thinkverse-scene.mp4" \
            | tee "$RUNNER_TEMP/hyperframes-smoke/ffprobe.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/hyperframes-smoke/ffprobe.json', 'utf8'));
          const duration = Number(p.format?.duration);
          const video = (p.streams || []).find(s => s.codec_type === 'video');
          if (!Number.isFinite(duration) || duration < 11 || duration > 13) {
            throw new Error('Expected a roughly 12-second MP4; got duration=' + duration);
          }
          if (!video || Number(video.width) !== 1920 || Number(video.height) !== 1080) {
            throw new Error('Expected a 1920x1080 video stream.');
          }
          if (!String(video.avg_frame_rate || '').startsWith('30/1')) {
            throw new Error('Expected 30 fps; got ' + video.avg_frame_rate);
          }
          console.log('MP4 metadata passed:', { duration, width: video.width, height: video.height, fps: video.avg_frame_rate, size: p.format.size });
          NODE

      - name: Detect blank-frame output
        run: |
          ffmpeg -hide_banner -loglevel error -ss 2 -i "$RUNNER_TEMP/hyperframes-smoke/thinkverse-scene.mp4" -frames:v 1 -f rawvideo -pix_fmt gray - \
            | python3 -c 'import sys, statistics; b=sys.stdin.buffer.read(); assert b, "No decoded frame"; p=list(b); mean=statistics.fmean(p); spread=statistics.pstdev(p); print({"sample_frame_mean_luma": round(mean,2), "pixel_spread": round(spread,2)}); assert spread > 8 and mean > 8, "Frame appears blank or nearly uniform"'

      - name: Upload synthetic ThinkVerse scene artifact
        uses: actions/upload-artifact@v4
        with:
          name: thinkverse-scene-smoke-test
          path: |
            ${{ runner.temp }}/hyperframes-smoke/thinkverse-scene.mp4
            ${{ runner.temp }}/hyperframes-smoke/ffprobe.json
          if-no-files-found: error
          retention-days: 3

      - name: Summarize verified result
        if: success()
        run: |
          {
            echo "## ThinkVerse scene smoke test"
            echo
            echo "- HyperFrames CLI: v0.9.19"
            echo "- Runtime: Node.js 22, Ubuntu 24.04"
            echo "- FFmpeg/FFprobe installed and used"
            echo "- Committed ThinkVerse composition injected into the project"
            echo "- GSAP loaded locally (no CDN dependency during render)"
            echo "- Lint/check passed"
            echo "- 12-second 1920x1080, 30 fps MP4 rendered and metadata-validated"
            echo "- Sample-frame blankness check passed"
            echo "- Synthetic test output only; artifact retention: 3 days"
            echo "- This is a scene calibration, not a complete long-form production test"
          } >> "$GITHUB_STEP_SUMMARY"
